name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: App version (for example 1.0.0)
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline regression checks
        run: ./scripts/test.sh
      - name: Compile application
        run: swift build -c release

  package:
    needs: test
    # Pull requests never receive the signing identity, including same-repo PRs.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import pinned signing identity
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${MACOS_SIGNING_P12_BASE64:?Missing signing certificate secret}"
          : "${MACOS_SIGNING_P12_PASSWORD:?Missing signing password secret}"
          python3 - <<'PY'
          import base64, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fatfish-signing.p12'
          path.write_bytes(base64.b64decode(os.environ['MACOS_SIGNING_P12_BASE64'], validate=True))
          PY
          KEYCHAIN_PATH="$RUNNER_TEMP/fatfish-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/fatfish-signing.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/fatfish-signing.p12"
      - name: Build and verify signed DMG
        env:
          APP_VERSION: ${{ inputs.version || '1.0.0' }}
        run: ./build.sh
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FatFishFairy-macOS-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fatfish-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/fatfish-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/fatfish-signing.p12"
