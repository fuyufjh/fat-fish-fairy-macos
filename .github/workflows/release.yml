name: macOS DMG release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package DMG (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version tags must have the form v1.2.3.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'Release tag must point to a commit on main.' >&2
            exit 1
          fi
          echo "APP_VERSION=${VERSION_TAG#v}" >> "$GITHUB_ENV"
      - name: Run offline tests
        run: ./scripts/test.sh
      - name: Import pinned signing identity
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${MACOS_SIGNING_P12_BASE64:?Missing signing certificate secret}"
          : "${MACOS_SIGNING_P12_PASSWORD:?Missing signing password secret}"
          python3 - <<'PY'
          import base64, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fatfish-signing.p12'
          path.write_bytes(base64.b64decode(os.environ['MACOS_SIGNING_P12_BASE64'], validate=True))
          PY
          KEYCHAIN_PATH="$RUNNER_TEMP/fatfish-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/fatfish-signing.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/fatfish-signing.p12"
      - name: Build, sign and verify DMG
        run: ./build.sh
      - name: Preserve DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FatFishFairy-${{ github.ref_name }}-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fatfish-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/fatfish-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/fatfish-signing.p12"

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download DMG and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          gh run download "$RUN_ID" --name "FatFishFairy-$VERSION_TAG-arm64" --dir dist
          if ! gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release create "$VERSION_TAG" --verify-tag --title "FatFishFairy $VERSION_TAG" --generate-notes --draft
          fi
          gh release upload "$VERSION_TAG" dist/*.dmg --clobber
          gh release edit "$VERSION_TAG" --draft=false
